# Выкладка на боевой сервер по тегу версии.
#
# Тег вида v1.2.0 запускает проверки, сборку образов служб и статики в GitHub
# Container Registry и выкладку на сервер. Ручной запуск с указанием тега
# выкладывает уже выпущенную версию, например для отката. Порядок выкладки на
# сервере описан в scripts/deploy.sh, настройка в README, раздел
# «Автоматическая выкладка».
name: Выкладка

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Тег выпущенной версии, например v1.2.0
        required: true
        type: string

permissions:
  contents: read

# Выкладки идут строго по очереди, начатая не прерывается.
concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/reviews

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Проверить тег
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ожидается тег вида v1.2.0, получено «$TAG»"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # pnpm появляется только после corepack enable, поэтому
          # встроенное кеширование setup-node здесь не работает.
          package-manager-cache: false

      - name: Установить зависимости
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  build:
    name: Сборка ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [console-api, widget-api, sync-worker, static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # При ручном запуске github.sha указывает на основную ветку, а не на тег.
      - name: Определить коммит тега
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Метка source связывает пакет с репозиторием, а скрипт выкладки по ней
      # находит свои образы, оставшиеся без тегов.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.TAG }}
          build-args: |
            VITE_CONSOLE_API_URL=${{ vars.VITE_CONSOLE_API_URL || 'https://api.console.reviews.stackra.ru' }}
            VITE_WIDGET_API_URL=${{ vars.VITE_WIDGET_API_URL || 'https://api.widget.reviews.stackra.ru' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Выкладка на сервер
    needs: build
    runs-on: ubuntu-24.04
    # Ожидание синхронизации может занять до 15 минут.
    timeout-minutes: 30
    environment:
      name: production
      url: https://console.reviews.stackra.ru
    steps:
      - name: Подготовить ключ SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Ключу на сервере разрешена только команда scripts/deploy.sh: тег
      # передается вместо команды и попадает в SSH_ORIGINAL_COMMAND.
      - name: Выложить ${{ env.TAG }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: >
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30
          "$DEPLOY_USER@$DEPLOY_HOST" "$TAG"

      - name: Удалить ключ SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
